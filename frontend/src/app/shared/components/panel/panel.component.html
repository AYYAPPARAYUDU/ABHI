<div class="abhi-panel" [class.panel-bordered]="bordered">
  <div *ngIf="title || icon" class="panel-header-wrap">
    <div class="panel-header-left">
      <span *ngIf="icon" class="panel-icon">{{ icon }}</span>
      <div class="panel-title-row">
        <span class="panel-accent-dot"></span>
        <h3 *ngIf="title" class="panel-title">{{ title }}</h3>
      </div>
    </div>
    <div class="panel-actions">
      <span *ngIf="badge" class="panel-capsule-badge">{{ badge }}</span>
      <ng-content select="[panel-actions]"></ng-content>
    </div>
  </div>
  <div class="panel-body">
    <ng-content></ng-content>
  </div>
</div>
