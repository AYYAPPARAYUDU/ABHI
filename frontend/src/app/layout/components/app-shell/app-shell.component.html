<!-- 3D Immersive Spatial Canvas Layer -->
<app-spatial-background></app-spatial-background>

<!-- Main Shell Container -->
<div class="abhi-app-shell">
  <!-- Floating Sidebar Navigation Dock -->
  <app-floating-sidebar></app-floating-sidebar>

  <!-- Workspace Container (Offset from sidebar) -->
  <div
    class="workspace-container"
    [class.collapsed-sidebar]="stateService.sidebarCollapsed()"
  >
    <!-- Reactive Global Safety / Alerts -->
    <app-global-safety-bar></app-global-safety-bar>

    <!-- Contextual Top Utility Bar -->
    <app-contextual-topbar></app-contextual-topbar>

    <!-- Primary Routed Content -->
    <main class="workspace-main" role="main">
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Command Palette (Ctrl+K) -->
  <app-command-palette></app-command-palette>

  <!-- Consent Gate Modal -->
  <app-consent-modal></app-consent-modal>
</div>
