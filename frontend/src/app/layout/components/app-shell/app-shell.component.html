<!-- 3D Immersive Spatial Canvas Layer (Dedicated strictly to 3D Core and 3D Workspace) -->
@if (is3DScenePage()) {
  <app-spatial-background></app-spatial-background>
}

<!-- Contextual High-Tech Ambient Background for Other Pages -->
@if (!is3DScenePage()) {
  <div class="contextual-page-bg" [ngClass]="pageBackgroundClass()"></div>
}

<!-- Main Shell Container -->
<div class="abhi-app-shell" [class.main-agent-shell]="isMainAgent()">
  <!-- Workspace Container (Spans full viewport with zero sidebar) -->
  <div
    class="workspace-container"
    [class.main-agent-view]="isMainAgent()"
  >
    <!-- Unified Master Spatial Topbar (Universally rendered across all views with integrated safety alerts) -->
    <app-contextual-topbar></app-contextual-topbar>

    <!-- Primary Routed Content -->
    <main
      class="workspace-main"
      [class.main-agent-main]="isMainAgent()"
      [style.zoom]="isMainAgent() ? '1' : (stateService.pageZoomLevel() / 100).toString()"
      role="main"
    >
      <router-outlet></router-outlet>
    </main>
  </div>

  <!-- Command Palette (Ctrl+K) -->
  <app-command-palette></app-command-palette>

  <!-- Consent Gate Modal -->
  <app-consent-modal></app-consent-modal>

  <!-- Human-Brain & Autonomous Communications Assistant Modal -->
  <app-assistant-modal></app-assistant-modal>

  <!-- Biometric Gatekeeper Lock Screen -->
  @if (stateService.isWorkspaceLocked()) {
    <app-workspace-lock-screen></app-workspace-lock-screen>
  }
</div>
