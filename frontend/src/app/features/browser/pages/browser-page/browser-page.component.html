<div class="browser-page-container">
  <div class="page-header">
    <div class="title-section">
      <h1 class="page-title">Browser & Web Automation</h1>
      <p class="page-subtitle">Phase 7 Stage 7.3 — Grounded Playwright Runtime, Origin Policy & Prompt Injection Guardrails</p>
    </div>
    <div class="search-bar">
      <input
        type="text"
        placeholder="Filter browser capabilities or skills..."
        (input)="onSearch($event)"
        class="search-input"
        data-testid="browser-search-input"
      />
    </div>
  </div>

  <app-browser-status-card
    [status]="browserService.status()"
    [activeSessions]="browserService.sessions()"
    [promptInjectionAlertsCount]="browserService.promptInjectionAlertsCount()"
    (startSession)="onStartSession($event)"
    (stopSession)="onStopSession($event)"
  ></app-browser-status-card>

  <app-browser-security-panel
    [securityEvents]="browserService.securityEvents()"
    (clearEvents)="onClearSecurityEvents()"
  ></app-browser-security-panel>

  <app-browser-capabilities-table
    [capabilities]="browserService.filteredCapabilities()"
  ></app-browser-capabilities-table>
</div>
