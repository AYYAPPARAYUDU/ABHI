<div class="memory-type-filter">
  <!-- Combined Filter Bar -->
  <div class="filter-row">
    <div class="filter-group">
      <span class="group-label">TYPE</span>
      <div class="chips-wrap">
        <button
          *ngFor="let t of memoryService.memoryTypes()"
          type="button"
          class="cyber-chip"
          [class.active]="currentType === t"
          (click)="setType(t)"
        >
          {{ t }}
        </button>
      </div>
    </div>

    <div class="filter-group">
      <span class="group-label">PRIVACY</span>
      <div class="chips-wrap">
        <button
          *ngFor="let p of memoryService.privacyClasses()"
          type="button"
          class="cyber-chip"
          [class.active]="currentPrivacy === p"
          (click)="setPrivacy(p)"
        >
          {{ p }}
        </button>
      </div>
    </div>
  </div>

  <!-- Domain Category Row -->
  <div class="filter-row domain-row">
    <div class="filter-group">
      <span class="group-label">DOMAIN</span>
      <div class="chips-wrap">
        <button
          type="button"
          class="cyber-chip"
          [class.active]="currentCategory === 'all'"
          (click)="setCategory('all')"
        >
          ALL ({{ memoryService.totalMemories() }})
        </button>
        <button
          *ngFor="let cat of memoryService.categories()"
          type="button"
          class="cyber-chip"
          [class.active]="currentCategory === cat"
          (click)="setCategory(cat)"
        >
          {{ cat }}
        </button>
      </div>
    </div>
  </div>
</div>
