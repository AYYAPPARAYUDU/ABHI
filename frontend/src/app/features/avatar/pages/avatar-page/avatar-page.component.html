<div class="avatar-page container-fluid px-0">
  <div class="row g-3">
    <!-- Center Stage: Large 3D Cognitive Core Viewport -->
    <div class="col-12 col-xl-8">
      <div class="avatar-stage-container p-3 rounded bg-dark border border-secondary border-opacity-25 shadow-lg">
        <app-avatar-viewport></app-avatar-viewport>
      </div>
    </div>

    <!-- Right Column: Avatar State Machine & Perception Feedback Controls -->
    <div class="col-12 col-xl-4 d-flex flex-column gap-3">
      <app-panel title="3D COGNITIVE CORE STATE ENGINE" icon="🧠" badge="THREE.JS WEBGL">
        <div class="d-flex flex-column gap-2 font-monospace small">
          <div class="p-2 rounded bg-dark border border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
            <span class="text-muted">COGNITIVE STATE:</span>
            <span class="fw-bold text-info">{{ avatarState() }}</span>
          </div>

          <div class="p-2 rounded bg-dark border border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
            <span class="text-muted">VOICE ACTIVITY:</span>
            <span class="badge" [class.bg-success]="voice().isListening" [class.bg-secondary]="!voice().isListening">
              {{ voice().sessionState }}
            </span>
          </div>

          <div class="p-2 rounded bg-dark border border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
            <span class="text-muted">HEAD POSE GAZE:</span>
            <span class="text-light">Yaw: {{ faceHead().headPose.yaw }}° | Pitch: {{ faceHead().headPose.pitch }}°</span>
          </div>

          <div class="p-2 rounded bg-dark border border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
            <span class="text-muted">GESTURE INTERLOCK:</span>
            <span class="badge bg-secondary bg-opacity-25 text-light">{{ gesture().detectedGesture }}</span>
          </div>

          <div class="p-2 rounded bg-dark border border-secondary border-opacity-25 d-flex justify-content-between align-items-center">
            <span class="text-muted">RENDER ZONE:</span>
            <span class="badge bg-primary bg-opacity-25 text-primary">OUTSIDE_ANGULAR (60 FPS)</span>
          </div>
        </div>
      </app-panel>

      <app-execution-timeline></app-execution-timeline>
    </div>
  </div>
</div>
