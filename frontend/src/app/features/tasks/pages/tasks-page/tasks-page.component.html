<div class="tasks-page container-fluid px-0">
  <!-- Top: Selected Task Detail (if any selected) -->
  <div *ngIf="taskHistory.selectedTask()" class="row g-3 mb-3">
    <div class="col-12">
      <app-task-detail></app-task-detail>
    </div>
  </div>

  <div class="row g-3">
    <!-- Left Column: Task Submission & Live Task List -->
    <div class="col-12 col-xl-7 d-flex flex-column gap-3">
      <app-task-panel></app-task-panel>
      <app-task-list></app-task-list>
    </div>

    <!-- Right Column: Execution Timeline, Pipeline History & Safety Gate -->
    <div class="col-12 col-xl-5 d-flex flex-column gap-3">
      <app-safety-panel></app-safety-panel>
      <app-execution-timeline></app-execution-timeline>
      <app-execution-history></app-execution-history>
    </div>
  </div>
</div>
