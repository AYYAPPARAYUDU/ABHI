<div class="card bg-dark border-secondary border-opacity-50 shadow-sm p-3 h-100">
  <div class="d-flex align-items-center justify-content-between mb-3">
    <div class="d-flex align-items-center gap-2">
      <span class="fs-5">🔥</span>
      <h3 class="h6 mb-0 font-monospace text-light fw-bold">BENCHMARK PERFORMANCE HEATMAP</h3>
    </div>
    <span class="badge bg-secondary bg-opacity-25 text-light font-monospace small">
      6 TASKS × 5 DIALECTS
    </span>
  </div>

  <div class="table-responsive">
    <table class="table table-dark table-borderless table-sm font-monospace small text-center mb-0">
      <thead>
        <tr class="border-bottom border-secondary border-opacity-25 text-muted">
          <th class="text-start">TASK / CAPABILITY</th>
          <th *ngFor="let lang of languages">{{ lang }}</th>
        </tr>
      </thead>
      <tbody>
        <tr *ngFor="let task of tasks; let tIdx = index">
          <td class="text-start text-light py-2">{{ task }}</td>
          <td *ngFor="let lang of languages; let lIdx = index" class="p-1">
            <div
              class="heatmap-cell rounded py-1 px-2 fw-bold"
              [ngClass]="getColorClass(getCellScore(tIdx, lIdx))"
              [title]="task + ' (' + lang + '): ' + (getCellScore(tIdx, lIdx) * 100).toFixed(0) + '%'"
            >
              {{ (getCellScore(tIdx, lIdx) * 100).toFixed(0) }}%
            </div>
          </td>
        </tr>
      </tbody>
    </table>
  </div>
</div>
