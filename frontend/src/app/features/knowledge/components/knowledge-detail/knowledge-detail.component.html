<div *ngIf="chunk" class="knowledge-detail-card card bg-dark border border-secondary border-opacity-25 p-3">
  <!-- Header -->
  <div class="d-flex justify-content-between align-items-start pb-3 border-bottom border-secondary border-opacity-25 mb-3">
    <div>
      <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
        <span class="badge bg-info bg-opacity-25 text-info border border-info font-monospace px-2 py-1">
          📄 {{ chunk.source }}
        </span>
        <span class="badge bg-success bg-opacity-25 text-success border border-success font-monospace px-2 py-1">
          RELEVANCE: {{ getScore(chunk) }}
        </span>
      </div>
      <h6 class="text-light mb-0 font-monospace fw-bold">{{ getCitation(chunk) }}</h6>
      <div class="text-muted small font-monospace mt-1">Chunk ID: {{ chunk.chunk_id }}</div>
    </div>
    <button class="btn btn-sm btn-outline-secondary font-monospace" (click)="knowledgeService.selectChunk(null)">
      ✕ Close Detail
    </button>
  </div>

  <!-- Full Text Body -->
  <div class="p-3 rounded bg-black bg-opacity-50 border border-secondary border-opacity-25 mb-3">
    <div class="text-info font-monospace small fw-bold mb-2">📖 VECTOR CHUNK CONTENT</div>
    <div class="text-light font-monospace small whitespace-pre-wrap">{{ chunk.text }}</div>
  </div>

  <!-- Metadata -->
  <div *ngIf="chunk.tags && chunk.tags.length" class="d-flex gap-1 flex-wrap">
    <span *ngFor="let t of chunk.tags" class="badge bg-black border border-secondary border-opacity-50 text-muted font-monospace">
      #{{ t }}
    </span>
  </div>
</div>
